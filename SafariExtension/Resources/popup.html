<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main>
    <h1>Stowmark</h1>
    <p id="status">Ready to save this page.</p>
    <label>Shelf <input id="shelf" type="text" placeholder="Optional"></label>
    <label>Note <textarea id="note" rows="2" placeholder="Optional"></textarea></label>
    <label>Tags <input id="tags" type="text" placeholder="design, workspace"></label>
    <div class="actions">
      <button id="save">Save page</button>
      <button id="excerpt">Save selection</button>
      <button id="undo" hidden>Undo</button>
      <button id="open">View in Library</button>
    </div>
  </main>
  <script type="module" src="popup.js"></script>
</body>
</html>
